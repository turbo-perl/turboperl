name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Releases are built for both, so both are tested.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      # There is no terminal on the runner; tmux and the IDE both want one
      # described.
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal, tmux and perl-doc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fpc fp-units-fv tmux perl perl-doc cpanminus

      # The integrated debugger drives Devel::ebug, which is not packaged
      # for Ubuntu.  --notest because its own suite wants Expect and a
      # terminal, which is not what is being tested here.
      - name: Install Devel::ebug
        run: sudo cpanm --notest --quiet Devel::ebug

      - name: Versions
        run: |
          fpc -iV
          tmux -V
          perl -v | sed -n 2p
          perl -MDevel::ebug -e 'print "Devel::ebug $Devel::ebug::VERSION\n"'

      - name: Build
        run: make

      - name: Test
        run: make test

  # Windows builds with build.pl rather than make, and has no tmux for the
  # interface tests.  The port is still in progress, so this job is not yet
  # one of those the "test" check below waits on: it shows where Windows
  # stands without holding up merges.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The same installer winget uses, fetched from SourceForge, which is
      # slow and sometimes flaky, so it is kept between runs.
      - name: Cache the Free Pascal installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\fpc-installer
          key: fpc-3.2.2-win32-and-win64

      # Installed where a user's winget install puts it.  build.pl finds it
      # there by itself; FPC's bin directory is deliberately not on the PATH.
      - name: Install Free Pascal
        env:
          FPC_INSTALLER: ${{ runner.temp }}\fpc-installer\fpc-3.2.2.win32.and.win64.exe
        run: |
          if (-not (Test-Path $env:FPC_INSTALLER)) {
            New-Item -ItemType Directory -Force (Split-Path $env:FPC_INSTALLER) | Out-Null
            curl.exe -fsSL --retry 3 -o $env:FPC_INSTALLER `
              https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download
          }
          $hash = (Get-FileHash $env:FPC_INSTALLER -Algorithm SHA256).Hash
          if ($hash -ne '8C255390544B051388B577EB61C6191A04883264AFE0E3369B3600A56DAF7BDE') {
            throw "unexpected installer hash $hash"
          }
          Start-Process -Wait -FilePath $env:FPC_INSTALLER `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\FPC\3.2.2'

      # Whether Devel::ebug installs on Windows at all is one of the things
      # to find out, so a failure here should not stop the build and tests.
      - name: Install Devel::ebug
        continue-on-error: true
        run: cpanm --notest --quiet Devel::ebug

      - name: Versions
        run: |
          C:\FPC\3.2.2\bin\i386-win32\fpc.exe -iV
          perl -v | Select-Object -Skip 1 -First 1
          perl -e 'print eval { require Devel::ebug; qq{Devel::ebug $Devel::ebug::VERSION\n} } || qq{Devel::ebug not installed\n}'

      # The interface tests drive the IDE through VisionDrive, as the Linux
      # ones do through tmux.
      - name: Check out VisionDrive
        uses: actions/checkout@v4
        with:
          repository: turbo-perl/VisionDrive
          path: VisionDrive

      - name: Build VisionDrive
        run: |
          New-Item -ItemType Directory -Force VisionDrive\units | Out-Null
          C:\FPC\3.2.2\bin\i386-win32\fpc.exe -Px86_64 -FUVisionDrive\units `
            -FEVisionDrive VisionDrive\visiondrive.pas
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "VISIONDRIVE=$env:GITHUB_WORKSPACE\VisionDrive\visiondrive.exe" >> $env:GITHUB_ENV

      - name: Build
        run: perl build.pl

      - name: Test
        run: perl build.pl test

  # Branch protection requires a check called "test".  The matrix jobs are
  # named after their runners, so this one stands for all of them, and
  # runners can come and go without the protection rule changing.  It must
  # run even when a build fails: a skipped required check counts as passed.
  test:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every build passed
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "builds: $RESULT"
          test "$RESULT" = success
