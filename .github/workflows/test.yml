name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # There is no terminal on the runner; tmux and the IDE both want one
      # described.
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal, tmux and perl-doc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fpc fp-units-fv tmux perl perl-doc

      - name: Versions
        run: |
          fpc -iV
          tmux -V
          perl -v | sed -n 2p

      - name: Build
        run: make

      - name: Test
        run: make test
