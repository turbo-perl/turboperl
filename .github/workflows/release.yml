name: release

# A push to main that changes TPVersion is a release: the commit pushed,
# normally the merge commit of a pull request, is tagged v<version>, and .deb
# packages built from it for amd64 and arm64, and a zip and an installer for
# 64-bit Windows, are attached to the GitHub release of that tag.  Pushes that leave the version alone do nothing.
#
# It runs on the push rather than on the pull request closing so that the
# run belongs to the commit that gets tagged, and shows up beside its tests.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes in quick succession must not race each other to the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history, so that main as it was before the push is there
      # to compare with however many commits the push brought.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Has the version changed?
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tpversion() {
            git show "${1}:src/tpconst.pas" |
              sed -n "s/^ *TPVersion *= *'\([^']*\)'.*/\1/p"
          }
          new=$(tpversion HEAD)
          old=$(tpversion "$BEFORE")
          echo "version before the push: ${old:-(none)}, after: $new"
          if [ -z "$new" ]; then
            echo "::error::could not read TPVersion from src/tpconst.pas"
            exit 1
          fi
          if [ "$new" = "$old" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A version that has already been released has been reused by
          # mistake; say so rather than quietly doing nothing.
          if git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null; then
            echo "::error::v$new is already tagged; bump the version again"
            exit 1
          fi
          echo "changed=true"    >> "$GITHUB_OUTPUT"
          echo "version=$new"    >> "$GITHUB_OUTPUT"

  # Each architecture is built natively on a runner of its own kind; make
  # deb takes the architecture from dpkg, so nothing here names it.
  package:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fpc fp-units-fv

      - name: Build the package
        id: deb
        run: |
          make deb
          echo "file=$(ls packages/turboperl_*.deb)" >> "$GITHUB_OUTPUT"
          echo "arch=$(dpkg --print-architecture)"   >> "$GITHUB_OUTPUT"

      # Install it for real, which proves the package is well formed and
      # its dependencies resolve, and check it is the version being tagged.
      - name: Check the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB: ${{ steps.deb.outputs.file }}
        run: |
          dpkg-deb --info "$DEB"
          sudo apt-get install -y "./$DEB"
          got=$(/usr/bin/turboperl --version)
          echo "$got"
          test "$got" = "TurboPerl $VERSION"
          test -f /usr/share/turboperl/lib/TurboPerl/Debug/Bridge.pm

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ steps.deb.outputs.arch }}
          path: ${{ steps.deb.outputs.file }}
          if-no-files-found: error

  # Built with build.pl, which takes the version from the IDE as make deb
  # does.
  package-windows:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        uses: ./.github/actions/install-fpc-windows

      # cpanfile's develop modules are what build.pl needs for the zip.
      - name: Install Perl modules
        run: cpanm --notest --quiet --installdeps --with-develop .

      - name: Build the zip
        run: perl build.pl zip

      # Unzip it and run what is inside, which proves the zip is whole and
      # is the version being tagged.
      - name: Check the zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Expand-Archive "packages\turboperl-$env:VERSION-win64.zip" $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP "turboperl-$env:VERSION-win64"
          $got = & (Join-Path $dir 'turboperl.exe') --version
          Write-Output $got
          if ($got -ne "TurboPerl $env:VERSION") { exit 1 }
          if (-not (Test-Path (Join-Path $dir 'lib\TurboPerl\Debug\Bridge.pm'))) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: zip-win64
          path: packages/*.zip
          if-no-files-found: error

      - name: Install Inno Setup
        uses: ./.github/actions/install-inno-setup

      - name: Build the installer
        run: perl build.pl installer

      # Install it, PATH and all, run what it installed, and uninstall it.
      - name: Check the installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./tests/check-installer.ps1 "packages\turboperl-$env:VERSION-setup.exe" $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: setup-win64
          path: packages/*-setup.exe
          if-no-files-found: error

  # Only once every package has built, so a failure on one architecture
  # never leaves a tag or a release with half its packages.
  release:
    needs: [version, package, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: packages
          merge-multiple: true

      - name: Tag and release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l packages
          gh release create "v$VERSION" packages/*.deb packages/*.zip packages/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TurboPerl $VERSION" \
            --generate-notes
